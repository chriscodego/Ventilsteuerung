[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventilsteuerung"
version = "0.1.0"
description = "Standalone desktop application (PySide6) — Ventilsteuerung"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Christian Gerken", email = "christian.gerken@upb.de" }]

dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.7",
]

[project.gui-scripts]
ventilsteuerung = "ventilsteuerung.__main__:main"

[project.scripts]
ventilsteuerung-cli = "ventilsteuerung.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ventilsteuerung"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions always import `sa` and `op`, used or not.
"src/ventilsteuerung/migrations/versions/*.py" = ["F401", "E501"]
"src/ventilsteuerung/migrations/env.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ventilsteuerung"]
plugins = []

[[tool.mypy.overrides]]
module = ["PySide6.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Autogenerated revisions are not hand-written code; strict mode is noise there.
module = ["ventilsteuerung.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that require a Qt event loop (pytest-qt)",
    "slow: long-running tests",
]
